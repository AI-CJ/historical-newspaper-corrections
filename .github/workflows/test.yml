name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newspaper_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/newspaper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the editor
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Check competing saves in two Chromium sessions
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/newspaper_test
        run: |
          python -m pip install playwright==1.56.0
          export CHROME_BIN="$(command -v google-chrome)"
          for migration in migrations/*.sql; do
            psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f "$migration"
          done
          python -m backend.seed
          python -m uvicorn backend.api:app --port 8053 &
          server=$!
          trap 'kill "$server"' EXIT
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:8053/pages >/dev/null
          python tests/browser_conflict.py
